name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dari
          POSTGRES_PASSWORD: dari
          POSTGRES_DB: dari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dari" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dari:dari@localhost:5432/dari_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_S3_ENDPOINT: http://localhost:9000
      REQUIRE_CHROMIUM: "1" # a missing browser fails the PDF tests instead of skipping them
    steps:
      - uses: actions/checkout@v4
      # MinIO cannot be a `services:` container (it needs a command), so it is started here. The storage
      # contract tests run against it whenever TEST_S3_ENDPOINT is set.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Fiche PDF tests drive a real Chromium and check that Arabic text renders (needs an Arabic-capable font).
      - name: Install Chromium and fonts for the PDF tests
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-core
      - run: npm run db:generate
      - run: npm run db:validate
      - name: Apply migrations and seed (proves the migration set is complete)
        run: |
          npm run db:deploy --workspace apps/api
          npm run db:seed --workspace apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Postgres)
        run: npm run test:int
      # Known: deepmerge-ts (high) via the Prisma CLI, build-time only, no upstream fix yet.
      # Tighten to `high` as soon as Prisma ships a release that no longer depends on deepmerge-ts <8.
      - name: Dependency audit (production deps, fail on critical)
        run: npm audit --omit=dev --audit-level=critical

  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements.txt
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dari
          POSTGRES_PASSWORD: dari
          POSTGRES_DB: dari_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dari" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dari:dari@localhost:5432/dari_e2e
      E2E_DATABASE_URL: postgresql://dari:dari@localhost:5432/dari_e2e
      E2E_MAIL_DIR: /tmp/dari-e2e-mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy --workspace apps/api
      # The Phase 3 e2e uses the demo account (one user per role) and the development consent text from the seed.
      - run: npm run db:seed --workspace apps/api
      - name: Build API and web
        run: |
          npm run build --workspace apps/api
          npm run build --workspace apps/web
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - name: End-to-end tests (phone viewport)
        run: npm run test:e2e --workspace apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
