services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: dari, POSTGRES_PASSWORD: dari, POSTGRES_DB: dari }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  ocr:
    profiles: ["ocr"] # opt-in: docker compose --profile ocr up
    build: ./services/ocr
    environment:
      OCR_SHARED_SECRET: ${OCR_SHARED_SECRET:?set OCR_SHARED_SECRET in .env (openssl rand -base64 32)}
    ports: ["127.0.0.1:8001:8001"]
    read_only: true
volumes:
  pgdata:
  miniodata:
