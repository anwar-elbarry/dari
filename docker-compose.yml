services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: dari, POSTGRES_PASSWORD: dari, POSTGRES_DB: dari }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # S3-compatible object storage for development. MinIO's public images are no longer pullable, so this runs s3rver
  # (from npm, the same server CI uses). Development only: production uses a real private, encrypted bucket.
  s3:
    image: node:22-alpine
    command: ["npx", "--yes", "s3rver@3.7.1", "-d", "/data", "-a", "0.0.0.0", "-p", "9000", "--configure-bucket", "dari-private"]
    ports: ["9000:9000"]
    volumes: [s3data:/data]
  ocr:
    profiles: ["ocr"] # opt-in: docker compose --profile ocr up
    build: ./services/ocr
    environment:
      OCR_SHARED_SECRET: ${OCR_SHARED_SECRET:?set OCR_SHARED_SECRET in .env (openssl rand -base64 32)}
    ports: ["127.0.0.1:8001:8001"]
    read_only: true
volumes:
  pgdata:
  s3data:
