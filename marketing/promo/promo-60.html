.row4 { display: grid; grid-template-columns: 150px 130px 190px 1fr; align-items: center; height: 62px; border-bottom: 1.5px solid var(--mercury); font: 600 21px 'Inter'; color: var(--ink); padding: 0 6px; }

.feed { width: 330px; height: 104px; border-radius: 24px; background: var(--card-d); border: 1.5px solid var(--bone-d); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.feed .ic { width: 54px; height: 54px; border-radius: 16px; background: var(--merc-d); display: grid; place-items: center; flex: none; }
.feed .ic svg, .tile .ic svg, .mini .ic svg { width: 30px; height: 30px; fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.mcal .c { height: 40px; border-radius: 10px; background: var(--merc-d); font: 600 13px 'Inter'; color: var(--ash-d); padding: 5px 7px; }
.mcal .c.e { background: transparent; }
.mcal .wd { font: 600 14px 'Inter'; color: var(--ash-d); text-align: center; }
.wcard { background: var(--white); border-radius: 32px; box-shadow: 0 34px 70px rgba(15, 15, 16, 0.10), 0 0 0 1px rgba(15, 15, 16, 0.05); padding: 40px; }
.track { position: relative; height: 16px; border-radius: 8px; background: var(--mercury); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 8px; }
.track > b { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--white); }
.tile { width: 380px; height: 330px; border-radius: 32px; background: var(--card-d); border: 1.5px solid var(--bone-d); padding: 34px; display: flex; flex-direction: column; }
.tile .ic { width: 96px; height: 96px; border-radius: 26px; background: var(--merc-d); display: grid; place-items: center; }
.tile .ic svg { width: 56px; height: 56px; stroke-width: 2.6; }
.mini { width: 440px; height: 290px; border-radius: 30px; background: var(--white); box-shadow: 0 30px 60px rgba(15, 15, 16, 0.14); padding: 32px; display: flex; flex-direction: column; justify-content: space-between; }
.mini .ic { width: 70px; height: 70px; border-radius: 20px; background: var(--night); display: grid; place-items: center; }
.mini .ic svg { width: 38px; height: 38px; }
.cap-wrap { position: absolute; left: 0; right: 0; text-align: center; overflow: hidden; padding: 0.04em 0 0.14em; }
.chip2 { display: inline-flex; align-items: center; height: 56px; padding: 0 26px; border-radius: 999px; background: var(--mercury); color: var(--carbon); font: 700 24px 'Jakarta'; margin: 0 7px; }
</style>

/* Headline: lines slide up out of their masks from `at` (one `gap` apart), the marker sweeps at `mark`, optional exit at `out`. */
function hl(el, t, at, { gap = 0.08, mark = at + 0.32, out = Infinity } = {}) {
  $$(el, '.li').forEach((li, i) => { const o = P(t, out + i * 0.04, 0.3, 'inCubic'); li.style.transform = `translateY(${(1 - P(t, at + i * gap, 0.55, 'outExpo')) * 110 - o * 120}%)`; });

function zel(z, t, { draw = null, base = '#232327', rings = [], rot = 0 }) {
  z.g.setAttribute('transform', `rotate(${rot} 960 540)`);
  for (const it of z.items) {
    let pulse = 0;
    for (const [s, v, w, a, life] of rings) { const age = t - s; if (age > 0 && age < life) pulse += a * Math.exp(-Math.pow((it.d - age * v) / w, 2)) * (1 - age / life); }
    it.el.style.strokeDashoffset = draw ? 1 - P(t, draw[0] + (it.d / 1100) * draw[1], 0.55, 'outCubic') : 0;
    it.el.setAttribute('stroke', mix(base, '#e4f222', Math.min(1, pulse)));
  }
}
